name: Bug report
description: Something was not cleaned, was reported wrongly, or crashed.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not attach personal files.** If you can, reproduce the problem with a synthetic file (see `tests/fixtures/build.py`).
        Security problems belong in a [private report](https://github.com/CodeWithLakxsh/veriscrub/security), not here.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the command you ran and what you expected.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Paste the `--json` output. Values are redacted by default; keep it that way.
      render: json
  - type: textarea
    id: doctor
    attributes:
      label: veriscrub doctor
      description: Paste the output of `veriscrub doctor`.
      render: text
    validations:
      required: true
  - type: input
    id: format
    attributes:
      label: File format and source
      placeholder: "e.g. HEIC from iPhone 15, PNG from ComfyUI, DOCX from Word 365"
