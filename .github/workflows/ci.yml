name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install ExifTool and FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl ffmpeg
      - name: Install ExifTool and FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install exiftool ffmpeg
      - name: Install ExifTool and FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install exiftool ffmpeg -y --no-progress

      - name: Install package
        run: python -m pip install -e ".[test]"
      - name: Doctor
        run: veriscrub doctor
      - name: Tests
        run: python -m pytest -q -rs

  no-backends:
    # Proves graceful "unsupported" handling when ExifTool/FFmpeg/pikepdf are absent.
    name: without external backends
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install package without the PDF extra
        run: python -m pip install -e . pytest Pillow
      - name: Hide any preinstalled ExifTool/FFmpeg
        run: |
          for t in exiftool ffmpeg ffprobe; do
            p="$(command -v "$t" || true)"; if [ -n "$p" ]; then sudo mv "$p" "$p.hidden"; fi
          done
      - name: Doctor (expected to report missing backends)
        run: veriscrub doctor || test $? -eq 3
      - name: Tests (backend-dependent tests skip)
        run: python -m pytest -q -rs

  skill:
    name: skill metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate SKILL.md frontmatter against the Agent Skills constraints
        run: |
          python3 - <<'EOF'
          import pathlib, re, sys
          p = pathlib.Path("skills/veriscrub/SKILL.md")
          text = p.read_text(encoding="utf-8")
          m = re.match(r"^---\n(.*?)\n---\n", text, re.S)
          assert m, "missing frontmatter"
          fm = dict(re.findall(r"^([a-z-]+):\s*(.*)$", m.group(1), re.M))
          name, desc = fm.get("name", ""), fm.get("description", "")
          assert re.fullmatch(r"[a-z0-9]+(-[a-z0-9]+)*", name) and len(name) <= 64, name
          assert name == p.parent.name, "name must match the directory"
          assert 0 < len(desc) <= 1024, len(desc)
          assert len(fm.get("compatibility", "")) <= 500
          assert len(text.splitlines()) < 500
          for ref in re.findall(r"\]\((references/[^)]+)\)", text):
              assert (p.parent / ref).is_file(), ref
          print("SKILL.md ok:", name, len(desc), "chars")
          EOF
