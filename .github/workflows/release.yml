name: Release

# Push a tag like v0.1.0 to build the package, run a smoke test and publish a GitHub Release
# with the wheel, sdist and a zip of the skill directory attached.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "$tag" = "$ver" || { echo "tag $tag != pyproject version $ver"; exit 1; }
      - name: Build wheel and sdist
        run: python -m pip install build && python -m build
      - name: Smoke-test the built wheel
        run: |
          python -m venv /tmp/smoke && /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/veriscrub --version
          /tmp/smoke/bin/veriscrub doctor || test $? -eq 3
      - name: Package the skill directory
        run: cd skills && zip -r "../dist/veriscrub-skill-${GITHUB_REF_NAME}.zip" veriscrub
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[?"v {f=1; next} /^## / && f {exit} f' CHANGELOG.md)"
          gh release create "$GITHUB_REF_NAME" dist/* --title "VeriScrub $GITHUB_REF_NAME" --notes "${notes:-See CHANGELOG.md}" --verify-tag
